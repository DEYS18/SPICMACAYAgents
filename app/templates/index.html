<!-- Landing page with agent cards. Added by Claude for SPIC MACAY Agents. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIC MACAY AI Agents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --spicmacay-red: #8B0000;
            --spicmacay-dark: #660000;
            --spicmacay-light: #DC143C;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .main-container { max-width: 1100px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, var(--spicmacay-red) 0%, var(--spicmacay-light) 100%);
            color: white; padding: 40px 30px; border-radius: 15px;
            text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 30px;
        }
        .header h1 { margin: 0; font-size: 2.5rem; font-weight: 700; }
        .header-subtitle { margin: 12px 0 0 0; font-size: 1.1rem; opacity: 0.92; }
        .section-label {
            font-size: 0.85rem; font-weight: 700; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--spicmacay-red);
            margin: 10px 0 16px 4px;
        }
        .card-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px; margin-bottom: 36px;
        }
        .agent-card {
            background: white; border-radius: 14px; padding: 28px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 2px solid transparent;
            transition: all 0.25s ease; cursor: pointer; text-decoration: none;
            color: inherit; display: flex; flex-direction: column;
        }
        .agent-card:hover {
            transform: translateY(-6px); box-shadow: 0 10px 24px rgba(139,0,0,0.16);
            border-color: var(--spicmacay-light);
        }
        .agent-card .icon-wrap {
            width: 58px; height: 58px; border-radius: 14px; display: flex;
            align-items: center; justify-content: center; font-size: 1.6rem;
            color: white; margin-bottom: 16px;
            background: linear-gradient(135deg, var(--spicmacay-red) 0%, var(--spicmacay-light) 100%);
        }
        .agent-card h3 { font-size: 1.25rem; font-weight: 700; margin: 0 0 8px 0; color: #2b2b2b; }
        .agent-card p { font-size: 0.95rem; color: #5f6571; margin: 0 0 18px 0; flex: 1; }
        .agent-card .go {
            font-weight: 600; color: var(--spicmacay-red); font-size: 0.92rem;
            display: inline-flex; align-items: center; gap: 7px;
        }
        .agent-card.muted .icon-wrap { background: linear-gradient(135deg, #6c757d 0%, #495057 100%); }
        .agent-card.muted .go { color: #495057; }
        .footer-links { text-align: center; padding: 16px; }
        .footer-links a { color: var(--spicmacay-red); text-decoration: none; margin: 0 14px; font-weight: 600; }
        .footer-links a:hover { text-decoration: underline; }
        @media (max-width: 600px) { .header h1 { font-size: 1.9rem; } }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>🎭 SPIC MACAY AI Agents</h1>
            <p class="header-subtitle">Choose an assistant to get started</p>
        </div>

        <div class="section-label">Guides &amp; Assistants</div>
        <div class="card-grid" id="card-grid">
            <!-- Existing event/voice assistant -->
            <a class="agent-card" href="/assistant">
                <div class="icon-wrap"><i class="fas fa-microphone-lines"></i></div>
                <h3>Event &amp; Voice Assistant</h3>
                <p>Register events, manage activities, and talk to the assistant by voice or text.</p>
                <span class="go">Open <i class="fas fa-arrow-right"></i></span>
            </a>
            <!-- Knowledge agents injected here by script; static fallback below -->
        </div>

        <div class="section-label">Management</div>
        <div class="card-grid">
            <a class="agent-card muted" href="/dashboard" target="_blank">
                <div class="icon-wrap"><i class="fas fa-chart-line"></i></div>
                <h3>Dashboard</h3>
                <p>View event statistics and manage records.</p>
                <span class="go">Open <i class="fas fa-arrow-right"></i></span>
            </a>
        </div>

        <div class="footer-links">
            <a href="/api" target="_blank"><i class="fas fa-code"></i> API</a>
            <a href="https://spicmacay.org" target="_blank"><i class="fas fa-external-link-alt"></i> SPIC MACAY Website</a>
        </div>
    </div>

    <script>
        // Build the knowledge-agent cards from the registry so new agents appear automatically.
        const FALLBACK = [
            { key: 'convention', name: 'Convention Guide', tagline: 'Your interactive guide to organising SPIC MACAY international conventions.', icon: 'fa-landmark' },
            { key: 'movement', name: 'Movement Programme Guide', tagline: 'Guidelines for organising SPIC MACAY movement programmes and activities.', icon: 'fa-people-group' }
        ];
        function renderCards(agents) {
            const grid = document.getElementById('card-grid');
            agents.forEach(a => {
                const card = document.createElement('a');
                card.className = 'agent-card';
                card.href = '/guide/' + a.key;
                card.innerHTML =
                    '<div class="icon-wrap"><i class="fas ' + (a.icon || 'fa-book') + '"></i></div>' +
                    '<h3>' + a.name + '</h3>' +
                    '<p>' + a.tagline + '</p>' +
                    '<span class="go">Open <i class="fas fa-arrow-right"></i></span>';
                grid.appendChild(card);
            });
        }
        fetch('/api/knowledge/agents')
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(d => renderCards(d.agents && d.agents.length ? d.agents : FALLBACK))
            .catch(() => renderCards(FALLBACK));
    </script>
</body>
</html>
