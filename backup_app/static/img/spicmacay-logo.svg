<?xml version="1.0" encoding="UTF-8"?>
<!--
  SPIC MACAY "eye" (yantra) emblem — vector recreation for use in the portal header.

  This is a faithful approximation drawn in SVG so it stays crisp at any size and needs
  no binary asset. If you have the official artwork, replace this file with it (keep the
  same filename) and every page picks it up automatically.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="SPIC MACAY">
  <title>SPIC MACAY</title>
  <g fill="none" stroke="#111111" stroke-width="3.5" stroke-linecap="round">
    <!-- Radiating lashes: a slightly larger vesica drawn with a dashed stroke -->
    <path d="M100 6 Q152 100 100 194 Q48 100 100 6 Z"
          stroke-width="9" stroke-dasharray="2 9" opacity="0.95"/>
    <!-- Main eye / vesica outline -->
    <path d="M100 18 Q142 100 100 182 Q58 100 100 18 Z" stroke-width="4"/>
    <!-- Inner contour -->
    <path d="M100 30 Q132 100 100 170 Q68 100 100 30 Z" stroke-width="2" opacity="0.55"/>
  </g>

  <!-- Central red bindu -->
  <circle cx="100" cy="100" r="20" fill="#E02B20"/>

  <!-- Upper and lower ornamental motifs inside the eye -->
  <g fill="#111111">
    <path d="M100 44 c6 10 9 16 9 22 0 6-4 10-9 10 s-9-4-9-10c0-6 3-12 9-22 z"/>
    <path d="M100 156 c-6-10-9-16-9-22 0-6 4-10 9-10 s9 4 9 10c0 6-3 12-9 22 z"/>
  </g>
</svg>
